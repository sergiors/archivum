services:
  traefik:
    image: traefik:v3.7.13
    restart: unless-stopped

    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80

    ports:
      - "80:80"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - traefik

  socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: socket-proxy
    restart: unless-stopped

    environment:
      PING: 1
      VERSION: 1
      BUILD: 1
      IMAGES: 1
      CONTAINERS: 1
      NETWORKS: 1
      POST: 1
      DELETE: 1

      TIMEOUT_CLIENT: 1h
      TIMEOUT_CONNECT: 10s
      TIMEOUT_SERVER: 1h

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2375/_ping"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped

    command: redis-server --protected-mode no

    volumes:
      - redis-data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped

    command:
      - --config=/etc/otelcol-contrib/config.yaml

    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus


  relay:
    image: ghcr.io/sergiors/relay:latest
    container_name: relay
    restart: unless-stopped

    depends_on:
      socket-proxy:
        condition: service_healthy
      otel-collector:
        condition: service_started

    environment:
      REDIS_URI: redis:6379
      REDIS_STREAM: events
      REDIS_GROUP: archivum

      TRAEFIK_NETWORK: traefik
      TRAEFIK_HOST_OVERRIDE: localhost

      LOG_LEVEL: DEBUG

      OTEL_SERVICE_NAME: relay
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

      METRICS_ADDR: :9090

      DOCKER_HOST: tcp://socket-proxy:2375

    healthcheck:
      test: ["CMD", "relay", "health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

    volumes:
      - ./functions:/functions:ro
      - relay-data:/var/lib/relay

volumes:
  redis-data:
  relay-data:
  prometheus-data:

networks:
  traefik:
    name: traefik
